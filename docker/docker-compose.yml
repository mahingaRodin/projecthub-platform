services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:Z,ro
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      springboot:
        condition: service_healthy

  nextjs:
    image: ${DOCKERHUB_USERNAME:-exam}/projecthub-nextjs:${IMAGE_TAG:-latest}
    build:
      context: ../app/frontend
      dockerfile: ../../docker/frontend.Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - frontend-dist:/export
    entrypoint: ["/bin/sh", "-c", "cp -a /usr/share/nginx/html/. /export/ && exec nginx -g 'daemon off;'"]

  springboot:
    image: ${DOCKERHUB_USERNAME:-exam}/projecthub-backend:${IMAGE_TAG:-latest}
    build:
      context: ../app/backend
      dockerfile: ../../docker/backend.Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: "8080"
      GIN_MODE: "release"
      JWT_SECRET: "${JWT_SECRET}"
      MONGO_URI: "mongodb://postgres:27017"
      MONGO_DB: "projecthub"
      CACHE_ENABLED: "true"
      VALKEY_ADDR: "redis:6379"
      VALKEY_PASSWORD: "${REDIS_PASSWORD}"
      CORS_ORIGINS: "http://localhost:5173,http://192.168.160.50,http://192.168.160.59:30080"
      SEED_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: mongo:4.4
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - postgres-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  frontend-dist:
