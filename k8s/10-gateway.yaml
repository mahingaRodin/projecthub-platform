apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: projecthub-gateway
  namespace: qt-spring-app
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: projecthub-route
  namespace: qt-spring-app
spec:
  parentRefs:
    - name: projecthub-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: springboot
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nextjs
          port: 80
