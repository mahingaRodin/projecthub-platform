apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs
  namespace: qt-spring-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs
  template:
    metadata:
      labels:
        app: nextjs
    spec:
      containers:
        - name: nextjs
          image: headie1/projecthub-nextjs:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs
  namespace: qt-spring-app
spec:
  selector:
    app: nextjs
  ports:
    - port: 80
      targetPort: 80
